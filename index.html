<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="images/favicon1.svg" type="image/svg+xml">
<title>port</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Victor+Mono:wght@400;500&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Victor Mono', monospace; }
  html { overflow-y: scroll; color-scheme: light; }
  body {
    background:#fff;
    width:100vw;
    cursor: default;
    min-height:100vh;
    overflow:hidden;
  }
  body.scrollable { overflow:visible; }

  #glCanvas {
    position:fixed; top:0; left:0;
    width:100%; height:100%;
    pointer-events:none; z-index:0;
  }
  .thumb {
    position:fixed;
    z-index:10;
    cursor:pointer;
    opacity:0;
    line-height:0;
    will-change:left,top,width,height,opacity;
  }
  .thumb img {
    display:block;
    pointer-events:none;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .thumb.settled img { object-fit:contain; }

  /* ── Project page ── */
  #project-page {
    display:none;
    min-height:100vh;
    padding:48px 0 80px;
  }
  #project-page.visible { display:block; }
  #project-page-inner {
    max-width:1200px;
    margin:0 auto;
    padding:0 5vw;
  }
  #project-nav {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:24px;
  }
  #back-btn {
    font-size:14px;
    color:#000; cursor:pointer;
    background:none; border:none;
    padding:12px 16px;
    opacity:0.65;
  }
  #project-arrows { display:flex; gap:8px; }
  #prev-btn, #next-btn {
    font-size:14px;
    color:#000; cursor:pointer;
    background:none; border:none;
    padding:12px 16px;
    opacity:0.5;
  }
  #prev-btn:disabled, #next-btn:disabled { opacity:0.15; cursor:default; }
  #project-gallery { display:flex; flex-direction:column; gap:4px; }
  .img-row { display:flex; gap:4px; width:100%; align-items:flex-start; }
  .img-row .img-wrap { flex-shrink:1; min-width:0; overflow:hidden; background:transparent; opacity:0; transition:opacity 0.4s; outline:1px solid #efefef; }
  .img-row .img-wrap.loaded { opacity:1; }
  .img-row .img-wrap img {
    width:100%; height:auto; display:block;
    image-rendering: auto;
    color-profile: sRGB;
    filter: none;
  }
  .img-row .img-wrap.is-gif img {
    width:auto; height:auto;
    max-width:100%;
    image-rendering: auto;
    color-profile: sRGB;
    filter: none;
  }

  /* Auto-pan: fixed height container, image scrolls horizontally */
  .autopan-wrap {
    width:100%; height:420px; overflow:hidden; position:relative; background:#e8e8e8; outline:1px solid #efefef;
    opacity:0; transition:opacity 0.4s;
  }
  .autopan-wrap.loaded { opacity:1; }
  .autopan-wrap img {
    height:100%; width:auto; max-width:none; display:block;
    animation:autoPan 18s linear infinite;
    image-rendering: high-quality;
    transform: translateZ(0);
    will-change: transform;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    image-rendering: -webkit-optimize-contrast;
  }

  @media (max-width:768px) {
    .img-row { flex-direction:column; }
    .img-row .img-wrap { width:100% !important; }
    .autopan-wrap { height:200px; }
  }
  @keyframes autoPan { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }

  /* ── Flash keyframes ── */
  @keyframes fadeInCard1  { 0%{opacity:0} 10%{opacity:0} 25%{opacity:.5} 50%{opacity:1} 100%{opacity:1} }
  @keyframes fadeInCard2  { 0%{opacity:0} 14%{opacity:0} 30%{opacity:.5} 56%{opacity:1} 100%{opacity:1} }
  @keyframes fadeInCard3  { 0%{opacity:0} 18%{opacity:0} 35%{opacity:.5} 62%{opacity:1} 100%{opacity:1} }
  @keyframes fadeInCard4  { 0%{opacity:0} 22%{opacity:0} 40%{opacity:.5} 68%{opacity:1} 100%{opacity:1} }
  @keyframes fadeInCard5  { 0%{opacity:0} 26%{opacity:0} 45%{opacity:.5} 74%{opacity:1} 100%{opacity:1} }
  @keyframes fadeInCard6  { 0%{opacity:0} 30%{opacity:0} 50%{opacity:.5} 80%{opacity:1} 100%{opacity:1} }
  @keyframes fadeInCard7  { 0%{opacity:0} 34%{opacity:0} 55%{opacity:.5} 86%{opacity:1} 100%{opacity:1} }
  .thumb.flying { animation: var(--fade-anim) var(--fly-dur) linear forwards; }

  /* ── Contact form ── */
  #contact {
    position:absolute;
    width:100%;
    padding:80px 0 100px;
  }
  @media (max-width:600px) {
    #contact { padding:32px 0 60px; }
  }
  #contact-inner {
    max-width:480px;
    margin:0 auto;
    padding:0 5vw;
  }
  .contact-input {
    width:100%; border:none; border-bottom:1px solid #d4d4d4;
    padding:12px 0; background:transparent; outline:none;
    font-family:inherit; font-size:9pt; resize:none; display:block;
    color:#000;
  }
  .contact-input:focus { border-bottom-color:#888; }
  .contact-input::placeholder { color:#bbb; }
  .contact-row { margin-bottom:20px; }
  .contact-submit {
    margin-top:32px; background:none; border:none; border-bottom:1px solid #bbb;
    padding:10px 0; font-family:inherit; font-size:9pt;
    cursor:default; letter-spacing:0.1em; color:#bbb;
    transition:color 0.2s, border-color 0.2s;
  }
  .contact-submit.ready {
    color:#000; border-bottom-color:#000; cursor:pointer;
  }
  #form-status { font-size:9pt; color:#a3a3a3; margin-top:8px; min-height:1em; }
</style>
</head>
<body>

<canvas id="glCanvas"></canvas>

<div id="project-page">
  <div id="project-page-inner">
    <div id="project-nav">
      <button id="back-btn">✕</button>
      <div id="project-arrows">
        <button id="prev-btn">←</button>
        <button id="next-btn">→</button>
      </div>
    </div>
    <div id="project-gallery"></div>
  </div>
</div>

<script>
const PROJECTS = [
  // ── Flash-only images (sequence only) ──
  { flashOnly:true, w:280, h:280, cover:'images/thumbnails/flash-01.jpg' },
  { flashOnly:true, w:280, h:280, cover:'images/thumbnails/flash-02.jpg' },
  { flashOnly:true, w:280, h:280, cover:'images/thumbnails/flash-03.jpg' },
  { flashOnly:true, w:280, h:280, cover:'images/thumbnails/flash-04.jpg' },
  { flashOnly:true, w:280, h:280, cover:'images/thumbnails/flash-05.jpg' },
  { flashOnly:true, w:280, h:280, cover:'images/thumbnails/flash-06.png' },

  // ── Project thumbnails (clickable, scattered) ──
  {
    id:0, w:280, h:200, perRow:2,
    cover:'images/thumbnails/RABBITX.png',
    gallery:[
      {src:'images/projects/RABBITX/01.jpg'},
      {src:'images/projects/RABBITX/02.png'},
      {src:'images/projects/RABBITX/03.png'},
      {src:'images/projects/RABBITX/05.png'},
      {src:'images/projects/RABBITX/06.png'},
    ]
  },
  {
    id:1, w:210, h:270,
    cover:'images/thumbnails/QWEST.png',
    gallery:[
      {src:'images/projects/QWEST/01.png'},
      {src:'images/projects/QWEST/02.jpg'},
      {src:'images/projects/QWEST/03.png', autoPan:true},
      {src:'images/projects/QWEST/04.jpg'},
      {src:'images/projects/QWEST/05.gif'},
    ]
  },
  {
    id:2, w:320, h:210,
    cover:'images/thumbnails/INTMAX.png',
    gallery:[
      {src:'images/projects/INTMAX/01.gif'},
      {src:'images/projects/INTMAX/02.gif'},
      {src:'images/projects/INTMAX/03.gif'},
      {src:'images/projects/INTMAX/04.png'},
      {src:'images/projects/INTMAX/05.png'},
      {src:'images/projects/INTMAX/06.png'},
      {src:'images/projects/INTMAX/07.png'},
    ]
  },
  {
    id:3, w:190, h:250,
    cover:'images/thumbnails/SEQUENCE.png',
    gallery:[
      {src:'images/projects/SEQUENCE/01.gif'},
      {src:'images/projects/SEQUENCE/02.png'},
      {src:'images/projects/SEQUENCE/08.gif'},
      {src:'images/projects/SEQUENCE/03.png'},
      {src:'images/projects/SEQUENCE/04.png'},
      {src:'images/projects/SEQUENCE/05.png'},
      {src:'images/projects/SEQUENCE/06.png'},
    ]
  },
  {
    id:4, w:250, h:180,
    cover:'images/thumbnails/STORJ.png',
    gallery:[
      {src:'images/projects/STORJ/01.png'},
      {src:'images/projects/STORJ/02.gif'},
      {src:'images/projects/STORJ/03.png'},
      {src:'images/projects/STORJ/04.png'},
    ]
  },
  {
    id:5, w:220, h:290, perRow:3,
    cover:'images/thumbnails/POTTERY.jpg',
    gallery:[
      {src:'images/projects/POTTERY/01.jpg'},
      {src:'images/projects/POTTERY/02.jpg'},
      {src:'images/projects/POTTERY/03.jpg'},
      {src:'images/projects/POTTERY/04.jpg'},
      {src:'images/projects/POTTERY/05.jpg'},
    ]
  },
  {
    id:6, w:290, h:200,
    cover:'images/thumbnails/STUFF.jpg',
    gallery:[
      {src:'images/projects/STUFF/01.jpg'},
      {src:'images/projects/STUFF/02.jpg'},
      {src:'images/projects/STUFF/03.jpg'},
    ]
  },
];

const flashOnlyItems = PROJECTS.filter(p => p.flashOnly);
const projectItems   = PROJECTS.filter(p => !p.flashOnly);

// ── WebGL ──
(function() {
  const canvas = document.getElementById('glCanvas');
  const gl = canvas.getContext('webgl2', {alpha:true});
  if (!gl) return;
  const resize = () => { canvas.width=innerWidth; canvas.height=innerHeight; gl.viewport(0,0,canvas.width,canvas.height); };
  resize(); window.addEventListener('resize', resize);
  const vs = `#version 300 es
  precision highp float;
  in vec2 a_pos; in float a_phase; in float a_speed;
  uniform float u_time; out float v_alpha;
  void main(){
    float t=u_time*a_speed;
    float y=mod(a_pos.y-t,1.0);
    float x=a_pos.x+sin(t*2.0+a_phase)*0.012;
    v_alpha=(1.0-abs(y-0.5)*2.0)*0.13;
    vec2 c=vec2(x,y)*2.0-1.0; c.y=-c.y;
    gl_Position=vec4(c,0.0,1.0); gl_PointSize=1.5;
  }`;
  const fs = `#version 300 es
  precision mediump float;
  in float v_alpha; out vec4 o;
  void main(){ o=vec4(0.,0.,0.,v_alpha); }`;
  const mk=(t,s)=>{ const sh=gl.createShader(t); gl.shaderSource(sh,s); gl.compileShader(sh); return sh; };
  const prog=gl.createProgram();
  gl.attachShader(prog,mk(gl.VERTEX_SHADER,vs));
  gl.attachShader(prog,mk(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(prog); gl.useProgram(prog);
  const N=500, pos=new Float32Array(N*2), ph=new Float32Array(N), sp=new Float32Array(N);
  for(let i=0;i<N;i++){ pos[i*2]=Math.random();pos[i*2+1]=Math.random();ph[i]=Math.random()*Math.PI*2;sp[i]=0.03+Math.random()*0.05; }
  const buf=(data,loc,sz)=>{ const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,sz,gl.FLOAT,false,0,0); };
  buf(pos,gl.getAttribLocation(prog,'a_pos'),2);
  buf(ph, gl.getAttribLocation(prog,'a_phase'),1);
  buf(sp, gl.getAttribLocation(prog,'a_speed'),1);
  const uT=gl.getUniformLocation(prog,'u_time');
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  let t0=null;
  (function frame(ts){ if(!t0)t0=ts; gl.clear(gl.COLOR_BUFFER_BIT); gl.uniform1f(uT,(ts-t0)/1000); gl.drawArrays(gl.POINTS,0,N); requestAnimationFrame(frame); })(0);
})();

// ── Constants ──
const FLASH_SCALE = 0.55;
const THUMB_SCALE = 0.8;
const MAX_THUMB   = 380;
const MOBILE_BP   = 900;
const LAST_PAUSE  = 200;
let scattered = false;
let homeScrollY = 0;
const getCX = () => innerWidth / 2;
const getCY = () => innerHeight / 2;

function naturalSize(nw, nh) {
  const s = Math.min(1, MAX_THUMB / Math.max(nw, nh));
  return { w: Math.round(nw * s), h: Math.round(nh * s) };
}

function makeSizedEl(coverSrc, pw, ph, clickable, scale) {
  scale = scale || FLASH_SCALE;
  const el = document.createElement('div');
  el.className = 'thumb';
  const fw = Math.round(pw * scale);
  const fh = Math.round(ph * scale);
  el.style.width   = fw + 'px';
  el.style.height  = fh + 'px';
  el.style.left    = (getCX() - fw/2) + 'px';
  el.style.top     = (getCY() - fh/2) + 'px';
  el.style.opacity = '0';
  if (!clickable) el.style.pointerEvents = 'none';
  const img = document.createElement('img');
  img.alt = '';
  img.onload = () => {
    const { w, h } = naturalSize(img.naturalWidth, img.naturalHeight);
    el.dataset.nw = w;
    el.dataset.nh = h;
    if (!scattered) {
      const side = Math.min(w, h);
      const fw2 = Math.round((w * 0.3 + side * 0.7) * scale);
      const fh2 = Math.round((h * 0.3 + side * 0.7) * scale);
      el.style.width  = fw2 + 'px';
      el.style.height = fh2 + 'px';
      el.style.left   = (getCX() - fw2/2) + 'px';
      el.style.top    = (getCY() - fh2/2) + 'px';
    }
  };
  img.src = coverSrc;
  el.appendChild(img);
  document.body.appendChild(el);
  return el;
}

const flashEls = flashOnlyItems.map(p => makeSizedEl(p.cover, p.w, p.h, false));
const cards = projectItems.map((p) => {
  const el = makeSizedEl(p.cover, p.w, p.h, true, THUMB_SCALE);
  el.addEventListener('click', () => openProject(p.id));
  return { el, p };
});

// ── Place cards ──
function placeCards(naturalDims) {
  const vw  = innerWidth;
  const gap = 80;
  const maxCardW = Math.max(...projectItems.map(p => p.w));
  const vscale = Math.min(1, (vw - gap * 2) / maxCardW);

  if (vw < MOBILE_BP) {
    const mEdge = 8, mGap = 48, mTop = 80;
    const ms = Math.min(1, (vw - mEdge * 2) / maxCardW);
    let y = mTop;
    const pos = projectItems.map((p, i) => {
      const nd = naturalDims && naturalDims[i];
      const w = nd ? nd.w : Math.floor(p.w * ms);
      const h = nd ? nd.h : Math.floor(p.h * ms);
      const e = { x: Math.floor((vw - w) / 2), y };
      y += h + mGap;
      return e;
    });
    return { positions: pos, totalHeight: y + mGap, vscale: ms };
  }

  const MAX_SITE_W = 1400;
  const layoutW = Math.min(vw, MAX_SITE_W);
  const n = projectItems.length;
  const totalHeight = Math.ceil(innerHeight * 2.8);
  const topPad = 120, botPad = 120;
  const bandH = Math.floor((totalHeight - topPad - botPad) / n);
  const halfW = Math.floor(layoutW / 2);
  const xOffset = Math.floor((vw - layoutW) / 2);
  const positions = [];

  for (let i = 0; i < n; i++) {
    const p = projectItems[i];
    const nd = naturalDims && naturalDims[i];
    const w = nd ? nd.w : Math.floor(p.w * vscale);
    const h = nd ? nd.h : Math.floor(p.h * vscale);
    const col = i % 2;
    const xMin = xOffset + (col === 0 ? gap : halfW + gap);
    const xMax = xOffset + (col === 0 ? halfW - w - gap : layoutW - w - gap);
    const nudge = (Math.random() - 0.5) * halfW * 0.18;
    const x = xMin + Math.random() * Math.max(1, xMax - xMin) + nudge;
    const yMin = topPad + i * bandH + gap;
    const yMax = Math.max(yMin + 1, topPad + (i + 1) * bandH - h - gap);
    const y = yMin + Math.random() * Math.max(1, yMax - yMin);
    positions.push({
      x: Math.max(xOffset + gap, Math.min(xOffset + layoutW - w - gap, x)),
      y: Math.max(gap, Math.min(totalHeight - h - gap, y))
    });
  }
  return { positions, totalHeight, vscale };
}

// ── Flash ──
function runFlash(onDone) {
  const foOrder = flashEls.map((_,i) => i);
  const projOrder = cards.map((_,i) => i).filter(i => cards[i].p.id !== 0);
  for (let i = projOrder.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [projOrder[i],projOrder[j]] = [projOrder[j],projOrder[i]];
  }
  const lastProjIdx = cards.findIndex(c => c.p.id === 0);
  projOrder.push(lastProjIdx);

  const allEls = [...flashEls, ...cards.map(c => c.el)];
  const sequence = [
    ...foOrder,
    ...projOrder.map(i => flashEls.length + i)
  ];

  let idx = 0;
  function getDuration(i) { return 200; }

  function flash() {
    if (idx >= sequence.length) {
      setTimeout(() => {
        flashEls.forEach(el => { el.style.opacity='0'; el.style.display='none'; });
        onDone({ lastIdx: lastProjIdx });
      }, LAST_PAUSE);
      return;
    }
    allEls.forEach(el => el.style.opacity = '0');
    allEls[sequence[idx]].style.opacity = '1';
    idx++;
    setTimeout(flash, getDuration(idx));
  }
  setTimeout(flash, 400);
}

// ── Fly out ──
function flyOut(lastIdx) {
  const naturalDims = cards.map(({el,p}) => el.dataset.nw
    ? { w: parseInt(el.dataset.nw), h: parseInt(el.dataset.nh) }
    : null);
  const { positions, totalHeight, vscale } = placeCards(naturalDims);
  document.body.style.height = totalHeight + 'px';
  document.body.classList.add('scrollable');

  const DURATION = 3.2;
  const EASE = 'cubic-bezier(0.16, 1, 0.3, 1)';
  const scrollY = window.scrollY || window.pageYOffset;

  cards.forEach(({ el, p }, i) => {
    const fx = positions[i].x;
    const fy = positions[i].y;
    const natW = el.dataset.nw ? parseInt(el.dataset.nw) : Math.floor(p.w * vscale);
    const natH = el.dataset.nh ? parseInt(el.dataset.nh) : Math.floor(p.h * vscale);
    const isLast = i === lastIdx;
    const delay  = i * 60;

    if (!isLast) el.style.opacity = '0';

    const curLeft = parseFloat(el.style.left);
    const curTop  = parseFloat(el.style.top);
    const curW    = parseFloat(el.style.width);
    const curH    = parseFloat(el.style.height);
    el.style.transition = 'none';
    el.style.position   = 'absolute';
    el.style.left       = curLeft + 'px';
    el.style.top        = (curTop + scrollY) + 'px';
    el.style.width      = curW + 'px';
    el.style.height     = curH + 'px';

    setTimeout(() => {
      el.style.transition = [
        `left   ${DURATION}s ${EASE}`,
        `top    ${DURATION}s ${EASE}`,
        `width  ${DURATION}s ${EASE}`,
        `height ${DURATION}s ${EASE}`,
      ].join(',');
      if (!isLast) {
        el.style.setProperty('--fly-dur', DURATION * 1.05 + 's');
        el.style.setProperty('--fade-anim', `fadeInCard${i+1}`);
        el.classList.add('flying');
      }
      el.style.left   = Math.round(fx) + 'px';
      el.style.top    = Math.round(fy) + 'px';
      el.style.width  = Math.round(natW) + 'px';
      el.style.height = Math.round(natH) + 'px';

      setTimeout(() => {
        el.style.transition = 'none';
        el.style.opacity    = '1';
        el.classList.remove('flying');
        el.classList.add('settled');
        el.style.left   = Math.round(fx) + 'px';
        el.style.top    = Math.round(fy) + 'px';
      }, (DURATION * 1000) + delay + 80);
    }, delay);
  });
  scattered = true;

  setTimeout(() => {
    const th = parseFloat(document.body.style.height) || document.body.scrollHeight;
    const contactEl = document.createElement('div');
    contactEl.id = 'contact';
    contactEl.style.cssText = 'position:absolute;top:' + th + 'px;width:100%;opacity:0;transition:opacity 1s ease;';
    contactEl.innerHTML = `
      <div id="contact-inner">
        <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
        <div class="contact-row"><input type="text" id="contact-name" class="contact-input" placeholder="name *"></div>
        <div class="contact-row"><input type="text" id="contact-details" class="contact-input" placeholder="email / phone / @"></div>
        <div class="contact-row"><textarea id="contact-message" class="contact-input" rows="4" placeholder="message *"></textarea></div>
        <button class="contact-submit" onclick="sendMessage()">send →</button>
        <p id="form-status"></p>
      </div>`;
    document.body.appendChild(contactEl);
    document.body.style.height = (th + contactEl.offsetHeight) + 'px';
    requestAnimationFrame(() => requestAnimationFrame(() => { contactEl.style.opacity = '1'; attachFormListeners(); }));
  }, 3200 + (cards.length * 60) + 400);
}

// ── Resize reflow ──
function reflow() {
  if (!scattered) {
    cards.forEach(({ el, p }) => {
      const w = parseFloat(el.style.width)  || p.w * FLASH_SCALE;
      const h = parseFloat(el.style.height) || p.h * FLASH_SCALE;
      el.style.left = (getCX() - w/2) + 'px';
      el.style.top  = (getCY() - h/2) + 'px';
    });
    return;
  }
  const naturalDims = cards.map(({el,p}) => el.dataset.nw
    ? { w: parseInt(el.dataset.nw), h: parseInt(el.dataset.nh) }
    : null);
  const { positions, totalHeight, vscale } = placeCards(naturalDims);
  document.body.style.height = totalHeight + 'px';
  cards.forEach(({ el, p }, i) => {
    el.style.transition = 'none';
    el.style.position   = 'absolute';
    el.style.left       = positions[i].x + 'px';
    el.style.top        = positions[i].y + 'px';
    const nw = el.dataset.nw ? parseInt(el.dataset.nw) : Math.floor(p.w * vscale);
    const nh = el.dataset.nh ? parseInt(el.dataset.nh) : Math.floor(p.h * vscale);
    el.style.width  = nw + 'px';
    el.style.height = nh + 'px';
  });
}
let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(reflow, 120); });

// ── Project page ──
let currentProjectId = 0;
const projectPage = document.getElementById('project-page');
const gallery     = document.getElementById('project-gallery');
const backBtn     = document.getElementById('back-btn');
const prevBtn     = document.getElementById('prev-btn');
const nextBtn     = document.getElementById('next-btn');

function updateArrows(id) {
  prevBtn.disabled = id <= 0;
  nextBtn.disabled = id >= projectItems.length - 1;
}

prevBtn.addEventListener('click', () => {
  if (currentProjectId > 0) openProject(currentProjectId - 1);
});
nextBtn.addEventListener('click', () => {
  if (currentProjectId < projectItems.length - 1) openProject(currentProjectId + 1);
});

function showHome() {
  projectPage.classList.remove('visible');
  document.getElementById('glCanvas').style.display = '';
  cards.forEach(c => c.el.style.display = '');
  if (scattered) {
    const ce = document.getElementById('contact');
    if (ce) {
      const naturalDims2 = cards.map(({el,p}) => el.dataset.nw ? {w:parseInt(el.dataset.nw),h:parseInt(el.dataset.nh)} : null);
      const { totalHeight: th2 } = placeCards(naturalDims2);
      ce.style.top = th2 + 'px';
      ce.style.display = 'block';
    }
  }
  const naturalDims = cards.map(({el,p}) => el.dataset.nw ? {w:parseInt(el.dataset.nw),h:parseInt(el.dataset.nh)} : null);
  const { totalHeight } = placeCards(naturalDims);
  document.body.style.height = totalHeight + 'px';
  requestAnimationFrame(() => window.scrollTo(0, homeScrollY));
}

function showProject(id) {
  const p = projectItems.find(p => p.id === id);
  if (!p) return;
  currentProjectId = id;
  updateArrows(id);
  document.getElementById('glCanvas').style.display = 'none';
  cards.forEach(c => c.el.style.display = 'none');
  const ce = document.getElementById('contact'); if (ce) ce.style.display = 'none';
  document.body.style.height = 'auto';
  window.scrollTo(0, 0);
  gallery.innerHTML = '';

  function groupIntoRows(items, perRow) {
    const rows = [];
    let i = 0;
    while (i < items.length) {
      const item = items[i];
      // autoPan always gets its own row
      if (item.autoPan) { rows.push([item]); i++; continue; }
      // Use perRow if set, otherwise default to 2 minimum, 3 maximum
      const max = perRow || 3;
      const min = perRow || 2;
      let count = Math.min(max, items.length - i);
      // Don't pull an autoPan into a multi-item row
      for (let k = 1; k < count; k++) {
        if (items[i + k] && items[i + k].autoPan) { count = k; break; }
      }
      // Single leftover: allow it as its own row with empty space beside it
      rows.push(items.slice(i, i + count));
      i += count;
    }
    return rows;
  }

  function renderRow(row) {
    if (row.length === 1 && row[0].autoPan) {
      const wrap = document.createElement('div');
      wrap.className = 'autopan-wrap';
      const img = document.createElement('img');
      img.src = row[0].src; img.alt = ''; img.decoding = 'sync';
      img.onload = () => wrap.classList.add('loaded');
      wrap.appendChild(img);
      gallery.appendChild(wrap);
      return;
    }
    const rowEl = document.createElement('div');
    rowEl.className = 'img-row';
    const totalRatio = row.reduce((s, it) => s + it.ratio, 0);
    row.forEach(item => {
      const wrap = document.createElement('div');
      const isGif = item.src.toLowerCase().endsWith('.gif');
      wrap.className = 'img-wrap' + (isGif ? ' is-gif' : '');
      let wrapWidth;
      if (row.length === 1) {
        // Solo image: roughly 1/3 of the row width
        wrapWidth = `40%`;
      } else {
        const pct = (item.ratio / totalRatio) * 100;
        const gapShare = (row.length - 1) * 4 / row.length;
        wrapWidth = `calc(${pct}% - ${gapShare}px)`;
      }
      wrap.style.width = wrapWidth;
      const img = document.createElement('img');
      img.src = item.src; img.alt = ''; img.decoding = 'sync'; img.loading = 'lazy';
      img.onload = () => wrap.classList.add('loaded');
      wrap.appendChild(img);
      rowEl.appendChild(wrap);
    });
    gallery.appendChild(rowEl);
  }

  const collected = [];
  let renderedCount = 0;

  function tryRenderRows(final) {
    const rows = groupIntoRows(collected.slice(renderedCount), p.perRow);
    const toRender = final ? rows : rows.slice(0, rows.length - 1);
    toRender.forEach(row => {
      renderRow(row);
      renderedCount += row.length;
    });
  }

  function loadNext(idx) {
    if (idx >= p.gallery.length) {
      tryRenderRows(true);
      return;
    }
    const item = p.gallery[idx];
    if (item.autoPan) {
      collected.push({ ...item, ratio: 999 });
      tryRenderRows(false);
      loadNext(idx + 1);
      return;
    }
    const img = new Image();
    img.onload = () => {
      collected.push({ ...item, ratio: img.naturalWidth / img.naturalHeight });
      tryRenderRows(false);
      loadNext(idx + 1);
    };
    img.onerror = () => {
      collected.push({ ...item, ratio: 16/9 });
      tryRenderRows(false);
      loadNext(idx + 1);
    };
    img.src = item.src;
  }
  loadNext(0);

  projectPage.classList.add('visible');
}

function openProject(id) {
  homeScrollY = window.scrollY || window.pageYOffset;
  history.pushState({ project: id, scrollY: homeScrollY }, '', `?project=${id}`);
  showProject(id);
}

backBtn.addEventListener('click', () => { history.pushState(null, '', location.pathname); showHome(); });

window.addEventListener('popstate', (e) => {
  if (e.state && e.state.project !== undefined) showProject(e.state.project);
  else {
    if (e.state && e.state.scrollY !== undefined) homeScrollY = e.state.scrollY;
    showHome();
  }
});

function checkURL() {
  const params = new URLSearchParams(location.search);
  const id = params.get('project');
  if (id !== null) { showProject(parseInt(id)); return true; }
  return false;
}

// ── Contact form ──
let lastSubmit = 0;

function checkFormReady() {
  const btn = document.querySelector('.contact-submit');
  if (!btn) return;
  const name    = document.getElementById('contact-name')?.value.trim();
  const details = document.getElementById('contact-details')?.value.trim();
  const message = document.getElementById('contact-message')?.value.trim();
  if (name && details && message) btn.classList.add('ready');
  else btn.classList.remove('ready');
}

// Attach listeners after form is injected
function attachFormListeners() {
  ['contact-name','contact-details','contact-message'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', checkFormReady);
  });
  checkFormReady();
}
const RATE_LIMIT_MS = 60000;

async function sendMessage() {
  const honeypot = document.querySelector('input[name="_gotcha"]');
  if (honeypot && honeypot.value) return;

  const now = Date.now();
  const status = document.getElementById('form-status');

  if (now - lastSubmit < RATE_LIMIT_MS) {
    const wait = Math.ceil((RATE_LIMIT_MS - (now - lastSubmit)) / 1000);
    status.textContent = `Please wait ${wait}s before sending again.`;
    return;
  }

  const name    = document.getElementById('contact-name').value.trim();
  const details = document.getElementById('contact-details').value.trim();
  const message = document.getElementById('contact-message').value.trim();

  if (!name || !details || !message) return;

  try {
    const res = await fetch('https://formspree.io/f/xzdwedeq', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ name, contact: details, message })
    });
    if (res.ok) {
      lastSubmit = Date.now();
      document.getElementById('contact-name').value = '';
      document.getElementById('contact-details').value = '';
      document.getElementById('contact-message').value = '';
      status.textContent = 'Message sent!';
      setTimeout(() => status.textContent = '', 3000);
    } else {
      status.textContent = 'Something went wrong. Try again.';
    }
  } catch(e) {
    status.textContent = 'Something went wrong. Try again.';
  }
}

if (history.scrollRestoration) history.scrollRestoration = 'manual';
window.scrollTo(0, 0);

if (!checkURL()) {
  runFlash(({ lastIdx }) => requestAnimationFrame(() => flyOut(lastIdx)));
}
</script>
